# Comprobación de cada PR hacia main. El ruleset de main (.github/rulesets/main.json)
# exige que el job `build` termine en verde antes de poder fusionar.
name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo al mismo PR cancela la ejecución anterior.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # postbuild: calcula los hashes de la CSP y comprueba que out/ no tenga
      # URLs de prueba (higgs.ai, figma.site, cloudfront).
      - name: Build
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
